name: Despliegue Automático (release-*)

# Se dispara cuando se pushea cualquier rama release-*
on:
  push:
    branches:
      - 'release-*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Conectarse al servidor por SSH y aplicar configuración
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          echo "Iniciando despliegue de ProxyReverse — versión: ${{ github.ref_name }}"
          cd /var/apps/reverseProxy

          git reset --hard
          git clean -fd
          git remote set-url origin https://oauth2:${{ secrets.GH_PAT }}@github.com/Dobledsoftware/ProxyReverse.git
          git fetch --all
          git checkout ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

          # Validar sintaxis contra el archivo NUEVO con un contenedor descartable.
          # docker exec nginx_proxy nginx -t NO sirve: el bind-mount de un archivo
          # suelto fija el inodo viejo y el contenedor no ve el default.conf actualizado.
          docker run --rm -v /var/apps/reverseProxy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro nginx:latest nginx -t

          # Recrear el contenedor (no "nginx -s reload") por el mismo motivo de arriba:
          # el proceso ya corriendo sigue con el inodo viejo aunque el archivo cambie.
          docker rm -f nginx_proxy
          docker run -d --name nginx_proxy -p 80:80 -v /var/apps/reverseProxy/nginx/default.conf:/etc/nginx/conf.d/default.conf --network reverseproxy_proxy-net --restart always nginx:latest

          echo "¡Configuración ${{ github.ref_name }} aplicada con éxito!"

    - name: Notificar deploy exitoso
      if: success()
      uses: dawidd6/action-send-mail@v4
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "✅ [ProxyReverse] Deploy exitoso — ${{ github.ref_name }}"
        to: ${{ secrets.ADMIN_EMAIL }}
        from: "Agenda CI/CD <${{ secrets.MAIL_USERNAME }}>"
        html_body: |
          <h2 style="color:#28a745">✅ Deploy completado</h2>
          <table>
            <tr><td><b>Versión</b></td><td>${{ github.ref_name }}</td></tr>
            <tr><td><b>Repo</b></td><td>ProxyReverse</td></tr>
            <tr><td><b>Commit</b></td><td>${{ github.sha }}</td></tr>
            <tr><td><b>Autor</b></td><td>${{ github.actor }}</td></tr>
          </table>
          <p>El proxy reverso está corriendo <b>${{ github.ref_name }}</b>.</p>
          <p><a href="https://github.com/${{ github.repository }}/actions">Ver acciones en GitHub</a></p>

    - name: Notificar deploy fallido
      if: failure()
      uses: dawidd6/action-send-mail@v4
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "❌ [ProxyReverse] Deploy FALLIDO — ${{ github.ref_name }}"
        to: ${{ secrets.ADMIN_EMAIL }}
        from: "Agenda CI/CD <${{ secrets.MAIL_USERNAME }}>"
        html_body: |
          <h2 style="color:#dc3545">❌ Deploy FALLIDO</h2>
          <table>
            <tr><td><b>Versión</b></td><td>${{ github.ref_name }}</td></tr>
            <tr><td><b>Repo</b></td><td>ProxyReverse</td></tr>
            <tr><td><b>Commit</b></td><td>${{ github.sha }}</td></tr>
            <tr><td><b>Autor</b></td><td>${{ github.actor }}</td></tr>
          </table>
          <p>La configuración de Nginx NO fue aplicada. El servidor sigue con la versión anterior.</p>
          <p><a href="https://github.com/${{ github.repository }}/actions">Revisar logs en GitHub Actions</a></p>
