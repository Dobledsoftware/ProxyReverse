version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /var/apps/landings:/var/apps/landings:ro
    networks:
      - reverseproxy_proxy-net
    restart: always

networks:
  reverseproxy_proxy-net:
    external: true
