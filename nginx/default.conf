server {
    listen 80;
    server_name agendastest.dobledsoftware.com.ar;

    # SSE: sin timeout de lectura para conexiones long-lived
    proxy_read_timeout 3600s;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://agenda-front:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Login — límite estricto anti brute-force
    location /api/auth/ {
        resolver 127.0.0.11 valid=30s;
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        limit_conn conn_limit 10;
        set $upstream http://agenda-srv:8091;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE (eventos tiempo real) — excluir del rate limit, son conexiones largas
    location /api/sse/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://agenda-srv:8091;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # API general
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        limit_conn conn_limit 20;
        set $upstream http://agenda-srv:8091;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

