# stock-dev / stock-qa / stock-uat.dobledsoftware.com.ar reemplazan a
# legendary.dobledsoftware.com.ar (dado de baja) -- un dominio por ambiente
# de la cadena develop -> QA -> UAT -> main (ver AGENTS.md de stock-srv/
# stock-front, issue #70/#49). Cada uno rutea al contenedor de ese ambiente
# por nombre en reverseproxy_proxy-net -- puerto interno de nginx del
# front es 80 (no el puerto publicado al host), y el de uvicorn del
# backend es 8001, siempre, en los tres ambientes.

server {
    listen 80;
    server_name stock-dev.dobledsoftware.com.ar;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://stock_front:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        # Protección básica flood: misma zona "api" que Agenda (120 req/min, burst 30).
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        set $upstream http://stock_api:8001;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

