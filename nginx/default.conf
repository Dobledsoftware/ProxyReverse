# ── Rate limiting zones ──────────────────────────────────────────────────────
# login: máx 10 req/min por IP (anti brute-force)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# api general: máx 120 req/min por IP (2/s promedio)
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
# limite de conexiones simultáneas por IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name dobledsoftware.com.ar www.dobledsoftware.com.ar;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://dobledsoftware-frontend:5172;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

