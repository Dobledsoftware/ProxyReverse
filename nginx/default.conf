server {
    listen 80;
    server_name agendastest.dobledsoftware.com.ar;

    # Las conexiones SSE (Server-Sent Events) son conexiones HTTP que se mantienen
    # abiertas durante horas para recibir notificaciones en tiempo real.
    # Sin este ajuste, Nginx las corta a los 60s (timeout por defecto).
    # 3600s = 1 hora de tolerancia antes de considerar la conexión muerta.
    proxy_read_timeout 3600s;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://agenda-front:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Login — límite estricto anti brute-force
    # Aplica la zona "login" (10 req/min).
    # burst=5: permite una ráfaga de hasta 5 requests extra antes de empezar a rechazar,
    #          para no cortar a un usuario que abre varias tabs a la vez.
    # nodelay: los requests dentro del burst se atienden de inmediato (sin hacer cola),
    #          y los que superan el burst reciben 429 al instante.
    # limit_conn 10: como máximo 10 conexiones TCP abiertas al mismo tiempo desde la misma IP.
    # limit_req_status 429: el cliente recibe HTTP 429 "Too Many Requests" (estándar REST).
    location /api/auth/ {
        resolver 127.0.0.11 valid=30s;
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        limit_conn conn_limit 10;
        set $upstream http://agenda-srv:8091;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE (Server-Sent Events) — eventos en tiempo real, sin rate limiting
    # Este bloque va ANTES de /api/ para que Nginx lo tome primero (matching por prefijo más largo).
    # No se aplica rate limit porque una conexión SSE es una sola request HTTP que permanece
    # abierta durante toda la sesión del usuario; limitarla cortaría las notificaciones en tiempo real.
    # proxy_buffering off: Nginx reenvía cada evento al cliente en cuanto llega, sin acumularlos.
    # proxy_cache off: los eventos no deben cachearse, son datos en vivo.
    location /api/sse/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://agenda-srv:8091;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # API general — todos los endpoints que no sean /auth/ ni /sse/
    # Aplica la zona "api" (120 req/min = 2/s promedio).
    # burst=30: tolera picos de hasta 30 requests instantáneos antes de rechazar
    #           (útil cuando el frontend carga varias queries en paralelo al iniciar).
    # limit_conn 20: máximo 20 conexiones simultáneas por IP.
    # Un usuario humano rara vez supera estos límites; un bot o un ataque flood sí los supera.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        limit_conn conn_limit 20;
        set $upstream http://agenda-srv:8091;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

