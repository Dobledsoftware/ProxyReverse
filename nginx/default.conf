# ── Zonas de rate limiting ────────────────────────────────────────────────────
#
# Estas zonas se definen una sola vez acá arriba y se reusan en cada server block.
# $binary_remote_addr = clave por dirección IP del cliente (versión compacta, ahorra memoria).
# El tamaño (10m) es la memoria reservada para guardar el estado de cada IP;
# 10MB alcanza para ~160.000 IPs distintas simultáneas.
#
# Zona "login": permite máximo 10 solicitudes por minuto por IP.
# Se usa en los endpoints de autenticación para frenar ataques de fuerza bruta
# (alguien intentando adivinar contraseñas en un loop).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
#
# Zona "api": permite máximo 120 solicitudes por minuto por IP (equivale a 2 por segundo en promedio).
# Se usa en la API general para cortar floods de requests automatizados (bots, scrapers, etc.)
# sin afectar a un usuario humano normal que raramente supera ese volumen.
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
#
# Zona "conn_limit": controla cuántas conexiones TCP simultáneas puede tener una misma IP.
# Complementa el rate limiting: aunque alguien abra muchas conexiones a la vez,
# se las limitamos por cantidad (no solo por velocidad de requests).
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name dobledsoftware.com.ar www.dobledsoftware.com.ar;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://dobledsoftware-frontend:5172;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

