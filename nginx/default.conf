server {
    listen 80;
    server_name dobledsoftware.com.ar www.dobledsoftware.com.ar;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://dobledsoftware-frontend:5172;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name odoo.dobledsoftware.com.ar;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://odoo_dev:8069;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name legendary.dobledsoftware.com.ar;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://stock_front:5174;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://stock_api:8001;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

